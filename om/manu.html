<!DOCTYPE html>
<html>
<head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<title>Menu</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

header{
    background:red;
    color:white;
    padding:20px;
    text-align:center;
}

.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    padding:30px;
}

.card{
    background:white;
    width:250px;
    margin:15px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    text-align:center;
}

img{
    width:100%;
    border-radius:10px;
    height:180px;
    object-fit:cover;
}

button{
    background:red;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:darkred;
}
*{
    box-sizing:border-box;
}

body{
    margin:0;
}

img{
    max-width:100%;
    height:auto;
}

.container{
    display:flex;
    flex-wrap:wrap;
}
</style>

<script>
function orderFood(item, price) {

    let name = prompt("Enter Your Name:");

    if(name == null || name.trim() === ""){
        alert("Name is required!");
        return;
    }

    let mobile = prompt("Enter Mobile Number:");

    if(mobile == null || mobile.trim() === ""){
        alert("Mobile Number is required!");
        return;
    }

    let address = prompt("Enter Delivery Address:");

    if(address == null || address.trim() === ""){
        alert("Address is required!");
        return;
    }

    let quantity = prompt("Enter Quantity:", "1");

    if(quantity == null || quantity <= 0){
        alert("Invalid Quantity!");
        return;
    }

    let total = price * quantity;

    alert(
        "? Order Placed Successfully!\n\n" +
        "Customer: " + name +
        "\nFood Item: " + item +
        "\nPrice: ?" + price +
        "\nQuantity: " + quantity +
        "\nTotal Amount: ?" + total +
        "\nMobile: " + mobile +
        "\nAddress: " + address
    );
}
</script>

</head>
<body>

<header>
<h1>Our Menu</h1>
</header>

<div class="menu">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd">
        <h3>Burger</h3>
        <p>?120</p>
        <button onclick="orderFood('Burger',120)">
            Order Now
        </button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591">
        <h3>Pizza</h3>
        <p>?250</p>
        <button onclick="orderFood('Pizza',250)">
            Order Now
        </button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec">
        <h3>French Fries</h3>
        <p>?90</p>
        <button onclick="orderFood('French Fries',90)">
            Order Now
        </button>
    </div>

</div>

</body>
</html>
