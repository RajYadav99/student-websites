<!DOCTYPE html>
<html>
<head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<title>Contact Us</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

header{
background:red;
color:white;
padding:20px;
text-align:center;
}

.contact{
width:50%;
margin:auto;
padding:30px;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
background:red;
color:white;
padding:10px 20px;
border:none;
cursor:pointer;
}
*{
    box-sizing:border-box;
}

body{
    margin:0;
}

img{
    max-width:100%;
    height:auto;
}

.container{
    display:flex;
    flex-wrap:wrap;
}
</style>
</head>
<body>

<header>
<h1>Contact Us</h1>
</header>

<div class="contact">

<form>
<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="5" placeholder="Your Message"></textarea>

<button>Send Message</button>
</form>

</div>

</body>
</html>
